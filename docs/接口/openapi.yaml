components:
  schemas:
    ActivationRequest:
      type: object
      properties:
        license_key:
          type: string
          maxLength: 40
        machine_code:
          type: string
          writeOnly: true
          maxLength: 500
          minLength: 4
        device_name:
          type: string
          maxLength: 120
        client_version:
          type: string
          maxLength: 40
      required:
      - license_key
      - machine_code
    ArchitectureEnum:
      enum:
      - x64
      - arm64
      - universal
      type: string
      description: |-
        * `x64` - x64
        * `arm64` - arm64
        * `universal` - Universal
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        action:
          type: string
          title: 动作
          maxLength: 50
        object_type:
          type: string
          title: 对象类型
          maxLength: 120
        object_id:
          type: string
          title: 对象 ID
          maxLength: 100
        object_repr:
          type: string
          title: 对象
          maxLength: 300
        detail:
          title: 详情
        request_id:
          type: string
          title: 请求 ID
          maxLength: 64
        ip_address:
          type: string
          nullable: true
          title: IP
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 时间
        actor:
          type: integer
          nullable: true
          title: 操作人
      required:
      - action
      - actor_name
      - created_at
      - id
      - object_type
    ChannelEnum:
      enum:
      - stable
      - beta
      type: string
      description: |-
        * `stable` - Stable
        * `beta` - Beta
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        eye_tracker_count:
          type: integer
          readOnly: true
        eye_trackers:
          type: array
          items:
            $ref: '#/components/schemas/EyeTrackerSummary'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          title: 客户编号
          maxLength: 40
        name:
          type: string
          title: 客户名称
          maxLength: 200
        contact_name:
          type: string
          title: 联系人
          maxLength: 100
        contact_phone:
          type: string
          title: 联系电话
          maxLength: 50
        contact_email:
          title: 联系邮箱
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
          title: 地址
          maxLength: 500
        status:
          allOf:
          - $ref: '#/components/schemas/CustomerStatusEnum'
          title: 状态
        notes:
          type: string
          title: 备注
      required:
      - code
      - created_at
      - eye_tracker_count
      - eye_trackers
      - id
      - name
      - updated_at
    CustomerEyeTracker:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
          title: 客户
        customer_name:
          type: string
          readOnly: true
        device_type:
          type: string
          format: uuid
          title: 设备类型
        device_type_code:
          type: string
          readOnly: true
        device_type_name:
          type: string
          readOnly: true
        display_name:
          type: string
          title: 设备名称
          maxLength: 120
        serial_number:
          type: string
          title: 设备序列号
          maxLength: 120
        status:
          allOf:
          - $ref: '#/components/schemas/CustomerEyeTrackerStatusEnum'
          title: 状态
        softdog_password:
          type: string
          writeOnly: true
          maxLength: 512
          minLength: 32
        softdog_password_configured:
          type: boolean
          readOnly: true
        softdog_password_hint:
          type: string
          readOnly: true
        notes:
          type: string
          title: 备注
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - customer_name
      - device_type
      - device_type_code
      - device_type_name
      - display_name
      - id
      - softdog_password_configured
      - softdog_password_hint
      - updated_at
    CustomerEyeTrackerStatusEnum:
      enum:
      - active
      - maintenance
      - retired
      type: string
      description: |-
        * `active` - 正常
        * `maintenance` - 维护中
        * `retired` - 已停用
    CustomerStatusEnum:
      enum:
      - active
      - suspended
      - closed
      type: string
      description: |-
        * `active` - 正常
        * `suspended` - 暂停
        * `closed` - 停用
    DeactivationRequest:
      type: object
      properties:
        license_key:
          type: string
          maxLength: 40
        machine_code:
          type: string
          writeOnly: true
          maxLength: 500
          minLength: 4
      required:
      - license_key
      - machine_code
    EyeTrackerSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device_type:
          type: string
          format: uuid
          title: 设备类型
        device_type_code:
          type: string
          readOnly: true
        device_type_name:
          type: string
          readOnly: true
        display_name:
          type: string
          title: 设备名称
          maxLength: 120
        serial_number:
          type: string
          title: 设备序列号
          maxLength: 120
        status:
          allOf:
          - $ref: '#/components/schemas/CustomerEyeTrackerStatusEnum'
          title: 状态
        softdog_password_configured:
          type: boolean
          readOnly: true
        softdog_password_hint:
          type: string
          readOnly: true
      required:
      - device_type
      - device_type_code
      - device_type_name
      - display_name
      - id
      - softdog_password_configured
      - softdog_password_hint
    EyeTrackerType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          title: 设备类型编码
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          title: 设备类型名称
          maxLength: 120
        manufacturer:
          type: string
          title: 厂商
          maxLength: 120
        description:
          type: string
          title: 说明
        is_active:
          type: boolean
          title: 启用
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    License:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        license_key:
          type: string
          readOnly: true
          title: 授权号
        customer:
          type: string
          format: uuid
          title: 客户
        customer_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/LicenseStatusEnum'
          title: 状态
        starts_at:
          type: string
          format: date-time
          title: 生效时间
        expires_at:
          type: string
          format: date-time
          title: 到期时间
        max_devices:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: 设备上限
        active_device_count:
          type: integer
          readOnly: true
        allow_online_activation:
          type: boolean
          title: 允许在线激活
        allow_offline_activation:
          type: boolean
          title: 允许离线授权
        offline_grace_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: 离线宽限天数
        notes:
          type: string
          title: 备注
        items:
          type: array
          items:
            $ref: '#/components/schemas/LicenseItem'
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
          title: 创建人
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_device_count
      - created_at
      - created_by
      - customer
      - customer_name
      - expires_at
      - id
      - items
      - license_key
      - updated_at
    LicenseDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        license:
          type: string
          format: uuid
          readOnly: true
        license_key:
          type: string
          readOnly: true
        machine_hash:
          type: string
          readOnly: true
