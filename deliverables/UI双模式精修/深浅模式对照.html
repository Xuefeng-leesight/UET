<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UET-SA · 深浅双模式精修</title>
<style>
:root{color-scheme:light;--bg:#f5f6f7;--surface:#fff;--ink:#292b30;--muted:#6b6e76;--blue:#326bb5;--soft:#e7eef8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}header{padding:24px 28px 16px;background:var(--surface)}h1{font-size:21px;letter-spacing:.01em;margin:0 0 5px;font-weight:600}p{margin:0;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 28px;background:var(--surface);position:sticky;top:0;z-index:2}nav,.modes{display:flex;gap:4px;flex-wrap:wrap}button{font:inherit;font-size:12px;padding:8px 12px;border:0;border-radius:7px;background:#f3f4f6;color:#565a63;cursor:pointer}button[aria-pressed=true]{background:var(--soft);color:var(--blue);font-weight:600}button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.stage{padding:20px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.stage.both{grid-template-columns:repeat(2,minmax(0,1fr))}figure{margin:0;min-width:0}figcaption{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}figcaption span:first-child{font-weight:600;color:var(--ink)}img{display:block;width:100%;height:auto;border-radius:10px}a{color:var(--blue);text-decoration:none}[hidden]{display:none!important}footer{padding:0 28px 24px;font-size:12px;color:var(--muted)}.tokens{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px}.token{display:flex;align-items:center;gap:6px}i{width:12px;height:12px;display:inline-block;border-radius:3px}code{font:11px ui-monospace,SFMono-Regular,Consolas,monospace}@media(max-width:800px){header,.toolbar{padding:16px}.stage{padding:16px}.stage.both{grid-template-columns:1fr}footer{padding:0 16px 16px}}
</style>
<header><h1>UET-SA · 深浅双模式精修</h1><p>保留紧凑布局，以中性灰阶组织界面；浅色为默认，深蓝主题已移除。</p><div class="tokens"><span class="token"><i style="background:#f5f6f7"></i>浅色底色 <code>#F5F6F7</code></span><span class="token"><i style="background:#1e1f22"></i>深色底色 <code>#1E1F22</code></span><span class="token"><i style="background:#326bb5"></i>浅色强调 <code>#326BB5</code></span><span class="token"><i style="background:#8aaee0"></i>深色强调 <code>#8AAEE0</code></span></div></header>
<div class="toolbar"><nav aria-label="查看页面"></nav><div class="modes" aria-label="展示模式"><button data-mode="modern-light" aria-pressed="true">浅色</button><button data-mode="dark" aria-pressed="false">深色</button><button data-mode="both" aria-pressed="false">并排对照</button></div></div>
<main class="stage"><figure data-theme="modern-light"><figcaption><span>浅色 · 默认</span><a target="_blank" rel="noopener">查看原图 ↗</a></figcaption><img width="1440" height="1000"></figure><figure data-theme="dark" hidden><figcaption><span>深色 · 炭灰</span><a target="_blank" rel="noopener">查看原图 ↗</a></figcaption><img width="1440" height="1000"></figure></main>
<footer>截图来自实际界面，使用隔离示例数据，不包含真实实验结果。已验证中英文、窄窗口、主题迁移与切换、空列表、导出状态、字重与数字宽度；Windows 真机尚未验收。</footer>
<script>
const pages=[['project','工程管理'],['records','实验记录'],['subjects','受试管理'],['export','数据导出'],['aoi','AOI 分析'],['visual','数据可视化'],['recording','实验录制'],['statistics','统计报表'],['insights','洞察报告'],['mapping','映射描点'],['design','实验设计'],['settings','主题设置'],['dashboard','主页']];let current='records',mode='modern-light';const nav=document.querySelector('nav'),stage=document.querySelector('.stage');for(const [key,label] of pages){const b=document.createElement('button');b.textContent=label;b.dataset.page=key;b.onclick=()=>{current=key;render()};nav.append(b)}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});function render(){nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===current)));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));stage.classList.toggle('both',mode==='both');document.querySelectorAll('figure').forEach(f=>{const theme=f.dataset.theme;f.hidden=mode!=='both'&&mode!==theme;const path=theme+'-'+current+'.png';f.querySelector('img').src=path;f.querySelector('img').alt=pages.find(p=>p[0]===current)[1]+' · '+(theme==='dark'?'深色':'浅色');f.querySelector('a').href=path})}render();
</script></html>
