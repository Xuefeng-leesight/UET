<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UET-SA · 第二轮 UI 精修对照</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172033;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:20px 24px 16px;background:white;border-bottom:1px solid #dce2ea}h1{margin:0 0 6px;font-size:21px;font-weight:650}p{margin:6px 0;color:#526277}main{padding:16px 24px 28px}
  .toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}.group{display:flex;gap:6px;align-items:center}button,a{font:inherit}button{min-height:34px;padding:6px 12px;border:1px solid #ccd6e1;background:white;color:#35445a;border-radius:6px;cursor:pointer}button:hover{border-color:#526277}button[aria-pressed=true]{background:#0369a1;border-color:#0369a1;color:white}button:focus-visible,a:focus-visible{outline:2px solid #0369a1;outline-offset:3px}.note{padding:10px 12px;background:white;border:1px solid #dce2ea;border-radius:6px;margin-bottom:14px;color:#35445a}
  .images{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}.images[data-view=both]{grid-template-columns:repeat(2,minmax(0,1fr))}figure{margin:0;min-width:0;border:1px solid #ccd6e1;border-radius:7px;background:white;overflow:hidden}figcaption{padding:8px 12px;font-size:12px;color:#526277;border-bottom:1px solid #dce2ea;display:flex;justify-content:space-between}img{display:block;width:100%;height:auto}.viewport{overflow:auto}.actual img{width:1440px;max-width:none}a{color:#0369a1;text-underline-offset:3px}footer{padding:18px 0 0;font-size:12px;color:#526277}label{display:flex;align-items:center;gap:6px;color:#526277;font-size:12px}[hidden]{display:none!important}
  @media(max-width:800px){header{padding:16px}main{padding:14px}.images[data-view=both]{grid-template-columns:minmax(0,1fr)}}
</style>
<header>
  <h1>UET-SA · 第二轮 UI 精修</h1>
  <p>本轮落实列表、分析侧栏与操作状态三项精修。以下为相同示例工程在第二轮修改前后的真实界面。</p>
</header>
<main>
  <div class="toolbar">
    <div class="group" role="group" aria-label="页面">
      <button data-page="records" aria-pressed="true">实验记录</button>
      <button data-page="subjects" aria-pressed="false">受试者列表</button>
      <button data-page="export" aria-pressed="false">数据导出</button>
      <button data-page="aoi" aria-pressed="false">AOI 分析</button>
      <button data-page="visual" aria-pressed="false">数据可视化</button>
    </div>
    <div class="group" role="group" aria-label="对照方式">
      <button data-view="before" aria-pressed="false">精修前</button>
      <button data-view="after" aria-pressed="true">精修后</button>
      <button data-view="both" aria-pressed="false">并排对照</button>
    </div>
    <label><input id="actual" type="checkbox">按原始像素查看</label>
  </div>
  <div class="note" id="note" aria-live="polite"></div>
  <div class="images" data-view="after" id="images">
    <figure id="before" hidden><figcaption>精修前 · 原有界面<a id="beforeLink" target="_blank" rel="noopener">打开原图</a></figcaption><div class="viewport"><img id="beforeImage" alt="精修前的实验记录界面"></div></figure>
    <figure id="after"><figcaption>精修后 · 当前代码<a id="afterLink" target="_blank" rel="noopener">打开原图</a></figcaption><div class="viewport"><img id="afterImage" alt="精修后的实验记录界面"></div></figure>
  </div>
  <footer>截图使用 12 条隔离示例记录与长名称。补充状态：<a href="export-progress.png" target="_blank">导出进行中</a> · <a href="export-partial.png" target="_blank">部分导出</a> · <a href="export-facial-partial.png" target="_blank">表情模块部分导出</a> · <a href="en-US-dark-export-failure.png" target="_blank">英文深色错误提示</a> · <a href="en-US-dark-mountain-records.png" target="_blank">窄窗口侧栏滚动</a> · <a href="en-US-modern-light-empty-subjects.png" target="_blank">空列表提示</a>。中英文、三主题及导出状态检查通过；尚未进行 Windows 真机验收。</footer>
</main>
<script>
  const pages={"records": {"name": "实验记录", "note": "行距收紧，数字与时间单行对齐；操作按钮不再挤成竖排。精修后勾选了两条记录，展示整行选中反馈。"}, "subjects": {"name": "受试者列表", "note": "统一表头与操作按钮，年龄数值右对齐；长名称截断并保留完整提示，空列表说明添加入口。"}, "export": {"name": "数据导出", "note": "显示已选数量与导出状态；区分成功、取消、失败、部分完成。示例截图中的导出结果来自隔离的模拟 IPC。"}, "aoi": {"name": "AOI 分析", "note": "保留 300px 侧栏；统一字号、分组、数值单位、范围提示与图标点击区域。参数与计算语义保持原有定义。"}, "visual": {"name": "数据可视化", "note": "统一筛选、时间轴、参数分组与记录标签；复杂参数分支使用整体侧栏滚动，窄窗口仍可访问全部记录。"}};
  let page='records',view='after';
  function render(){
    for(const button of document.querySelectorAll('[data-page]'))button.setAttribute('aria-pressed',String(button.dataset.page===page));
    for(const button of document.querySelectorAll('button[data-view]'))button.setAttribute('aria-pressed',String(button.dataset.view===view));
    for(const state of ['before','after']){const file=page+'-'+state+'.png';document.getElementById(state).hidden=view!=='both'&&view!==state;document.getElementById(state+'Image').src=file;document.getElementById(state+'Image').alt=(state==='before'?'精修前的':'精修后的')+pages[page].name+'界面';document.getElementById(state+'Link').href=file;}
    document.getElementById('images').dataset.view=view;document.getElementById('note').textContent=pages[page].note;
  }
  for(const button of document.querySelectorAll('[data-page]'))button.addEventListener('click',()=>{page=button.dataset.page;render()});
  for(const button of document.querySelectorAll('button[data-view]'))button.addEventListener('click',()=>{view=button.dataset.view;render()});
  document.getElementById('actual').addEventListener('change',e=>document.getElementById('images').classList.toggle('actual',e.target.checked));
  render();
</script>
</html>
