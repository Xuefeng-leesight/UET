# IP 访问专用（纯 HTTP，不含 HTTPS / 证书 / 域名绑定）。
# server_name 用通配 "_" 匹配任意 Host（IP 或域名），80 端口反代 app:8000，
# /static/ 由本层直接吐出（Django DEBUG=false 时不 serve 静态文件）。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 8g;
    client_body_timeout 300s;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        # unfold 静态文件无版本 hash（未启用 ManifestStaticFilesStorage），
        # 不能用 immutable，否则代码更新后浏览器仍命中旧缓存。
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 大文件下载专用：仅允许通过 X-Accel-Redirect 内部跳转访问（Django 鉴权后）。
    # nginx 直接 sendfile 发 /var/www/media 下的安装包，绕开 gunicorn worker 超时。
    location /internal-download/ {
        internal;
        alias /var/www/media/;
        sendfile on;
        sendfile_max_chunk 1m;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
